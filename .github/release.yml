# Configures GitHub's automatically generated release notes.
# GitHub reads this when you click "Generate release notes" on a release (or via the
# API), grouping merged PRs into the categories below by their labels. A PR lands in
# the first category whose labels it matches, so order is priority: breaking changes
# first, the catch-all "Other Changes" last. See:
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    # Keep noise out of the notes entirely.
    labels:
      - duplicate
      - invalid
      - wontfix
      - question
    # Dependency bumps opened by bots are summarized under Dependencies via the label
    # below; drop their author-line spam here if a bot is ever added.
    authors: []

  categories:
    - title: ⚠️ Breaking Changes
      labels:
        - breaking-change

    - title: 🚀 Features
      labels:
        - enhancement

    - title: 🐛 Bug Fixes
      labels:
        - bug

    - title: ⚡ Performance
      labels:
        - performance

    - title: 📖 Documentation
      labels:
        - documentation

    - title: 📦 Dependencies
      labels:
        - dependencies

    - title: 🧹 Maintenance
      labels:
        - maintenance

    # Anything merged without one of the labels above still shows up here, so nothing
    # silently disappears from the notes. The '*' catch-all must come last.
    - title: Other Changes
      labels:
        - "*"
